<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icona del collegamento sul desktop (48-256 px). Stesso segno del logo (static/logo.svg): il foglio del modello con
       l'angolo piegato, il nodo ocra del defunto e i due rami della devoluzione. Palette «modulo ministeriale». -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A8068"/>
      <stop offset="1" stop-color="#245847"/>
    </linearGradient>
    <linearGradient id="carta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1EC"/>
    </linearGradient>
    <linearGradient id="ocra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98A2B"/>
      <stop offset="1" stop-color="#A06410"/>
    </linearGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0E2A21" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#fondo)"/>
  <rect x="11" y="11" width="234" height="234" rx="51" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3"/>
  <!-- foglio -->
  <g filter="url(#ombra)">
    <path d="M70 44 h76 l40 40 v124 a8 8 0 0 1 -8 8 H70 a8 8 0 0 1 -8 -8 V52 a8 8 0 0 1 8 -8 z" fill="url(#carta)"/>
  </g>
  <path d="M146 44 v32 a8 8 0 0 0 8 8 h32 z" fill="#CFE2D7"/>
  <!-- righe del modulo -->
  <rect x="80" y="64" width="46" height="7" rx="3.5" fill="#2F6B57" fill-opacity=".22"/>
  <rect x="80" y="80" width="34" height="7" rx="3.5" fill="#2F6B57" fill-opacity=".14"/>
  <!-- albero della devoluzione -->
  <path d="M124 132 v20 M94 176 v-18 h60 v18" fill="none" stroke="#2F6B57" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="124" cy="118" r="17" fill="url(#ocra)"/>
  <circle cx="124" cy="118" r="17" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="94" cy="186" r="14" fill="#2F6B57"/>
  <circle cx="154" cy="186" r="14" fill="#2F6B57"/>
</svg>
