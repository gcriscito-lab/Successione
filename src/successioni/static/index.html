<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Successioni</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Successioni</div>
  <div class="titolo" id="titolo">Nessuna pratica aperta</div>
  <div class="azioni">
    <button id="bNuova" class="p">Nuova dichiarazione</button>
    <button id="bSalva" disabled>Salva modifiche</button>
    <button id="bControlla" disabled>Controlla</button>
    <button id="bStampa" disabled title="Disponibile quando l'esportazione dei dati sarà collegata">Stampa</button>
    <button id="bGenera" disabled title="Disponibile quando l'esportazione XML sarà collegata">Genera file</button>
    <button id="bInvia" disabled title="Disponibile dopo il collaudo del collegamento con i servizi dell'Agenzia">Invia</button>
  </div>
</header>
<div id="msg" role="status" aria-live="polite" hidden></div>
<div class="app">
  <aside class="rail" aria-label="Pratiche e quadri">
    <details class="pratiche" id="dPratiche" open>
      <summary>Pratiche</summary>
      <ul id="lista"></ul>
    </details>
    <nav id="albero" aria-label="Quadri della dichiarazione"></nav>
    <div class="info" id="info"></div>
  </aside>
  <main id="vista" tabindex="-1">
    <div class="vuoto" id="vuoto">
      <h1>Dichiarazioni di successione</h1>
      <p>Apri una pratica dall'elenco oppure avvia una nuova dichiarazione guidata.</p>
    </div>
  </main>
</div>
<section id="controlli" class="drawer" aria-label="Controlli" hidden>
  <div class="drawer-h"><strong id="cTitolo">Controlli</strong><span class="mut" id="cAmbito"></span><button id="cChiudi" class="l">Chiudi</button></div>
  <ul id="cLista"></ul>
</section>

<dialog id="wiz" aria-labelledby="wizT">
  <form method="dialog" id="wizForm">
    <h2 id="wizT">Nuova dichiarazione</h2>
    <ol class="passi" id="wizPassi"></ol>
    <div id="wizCorpo"></div>
    <p class="err" id="wizErr" role="alert"></p>
    <div class="wiz-az">
      <button type="button" id="wAnnulla" class="l">Annulla</button>
      <span class="sp"></span>
      <button type="button" id="wIndietro">Indietro</button>
      <button type="button" id="wAvanti" class="p">Avanti</button>
    </div>
  </form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
