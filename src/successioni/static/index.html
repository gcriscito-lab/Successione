<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Successioni</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --mut:#5b6573; --line:#d9dde3; --acc:#1f5fbf; --err:#b3261e; --ok:#1b7a3d; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --fg:#e6e8eb; --mut:#9aa3ad; --line:#2d333b; --acc:#6ea8fe; --err:#ff8a80; --ok:#6fd08c; --card:#1c2128; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:16px; margin:0; }
  header .mut { color:var(--mut); font-size:12px; }
  main { display:grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 49px); }
  aside { border-right:1px solid var(--line); padding:12px; background:var(--card); }
  section.area { padding:16px; min-width:0; }
  button { font:inherit; padding:5px 10px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer; }
  button.p { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
  input, select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--fg); width:100%; min-width:70px; }
  ul.pratiche { list-style:none; margin:8px 0; padding:0; }
  ul.pratiche li { padding:7px 8px; border-radius:6px; cursor:pointer; }
  ul.pratiche li.sel, ul.pratiche li:hover { background:var(--bg); }
  nav.tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; border-bottom:1px solid var(--line); }
  nav.tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; }
  nav.tabs button.on { border-bottom-color:var(--acc); font-weight:600; }
  .tbl { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { font-size:12px; color:var(--mut); font-weight:600; white-space:nowrap; }
  .err { color:var(--err); } .okc { color:var(--ok); } .mut { color:var(--mut); }
  .bad { border-color:var(--err); }
  #msg { padding:8px 12px; margin-bottom:12px; border-radius:6px; border:1px solid var(--line); background:var(--card); display:none; }
  #msg.e { border-color:var(--err); color:var(--err); } #msg.o { border-color:var(--ok); }
  .bar { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  code { font-family: ui-monospace, Consolas, monospace; font-size:12px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header><h1>Successioni</h1><span class="mut" id="info"></span><span class="mut" style="margin-left:auto" id="rev"></span></header>
<main>
  <aside>
    <div class="bar"><input id="nuovoTitolo" placeholder="Titolo nuova pratica" aria-label="Titolo nuova pratica"><button class="p" id="crea">Crea</button></div>
    <ul class="pratiche" id="lista"></ul>
  </aside>
  <section class="area">
    <div id="msg" role="status"></div>
    <div id="vuoto" class="mut">Seleziona o crea una pratica.</div>
    <div id="pratica" hidden>
      <nav class="tabs" id="tabs"></nav>
      <div id="pannello"></div>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const TABS = [["persone","Persone"],["beni","Beni"],["devoluzioni","Devoluzioni"],["passivita","Passività"],
              ["allegati","Documenti"],["controlli","Controlli"],["revisioni","Revisioni"]];
let SCHEMA = {}, P = null, TAB = "persone";

async function api(url, opt) {
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.messaggio || j.codice || r.statusText), {dati: j, stato: r.status});
  return j;
}
function msg(t, tipo) { const m = $("#msg"); m.textContent = t; m.className = tipo || ""; m.style.display = t ? "block" : "none"; }
const post = (u, b) => api(u, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(b)});

function mostra(kind, v) {
  if (v === undefined || v === null) return "";
  if (typeof v === "object" && v.stato) return "[" + v.stato + "]";
  if (kind === "quota" && typeof v === "object") return v.num + "/" + v.den;
  return String(v);
}
function leggiCampo(kind, testo) {
  testo = testo.trim();
  if (testo === "") return null;
  if (testo === "?") return {stato:"da_confermare"};
  if (testo.startsWith("[") && testo.endsWith("]")) return {stato: testo.slice(1,-1)};
  if (kind === "quota") { const m = testo.match(/^(\d+)\s*\/\s*(\d+)$/); return m ? {num:+m[1], den:+m[2]} : testo; }
  return testo;
}

async function caricaLista() {
  const l = await api("/api/pratiche");
  $("#lista").innerHTML = "";
  for (const p of l) {
    const li = document.createElement("li");
    li.textContent = p.titolo + " (rev. " + p.revisione + ")";
    if (P && P.pratica_id === p.id) li.className = "sel";
    li.onclick = () => apri(p.id);
    $("#lista").append(li);
  }
}
async function apri(id) {
  P = await api("/api/pratiche/" + id);
  $("#vuoto").hidden = true; $("#pratica").hidden = false;
  $("#rev").textContent = "revisione " + P.revisione;
  disegnaTabs(); await pannello(); await caricaLista();
}
function disegnaTabs() {
  $("#tabs").innerHTML = "";
  for (const [k, n] of TABS) {
    const b = document.createElement("button"); b.textContent = n; if (k === TAB) b.className = "on";
    b.onclick = async () => { TAB = k; disegnaTabs(); await pannello(); }; $("#tabs").append(b);
  }
}
async function salva(ops) {
  try {
    const r = await post("/api/pratiche/" + P.pratica_id + "/aggiorna", {revisione_attesa: P.revisione, operazioni: ops, chiave: crypto.randomUUID()});
    msg("Salvato: revisione " + r.revisione, "o"); await apri(P.pratica_id);
  } catch (e) {
    if (e.dati && e.dati.errori) msg(e.dati.errori.map(x => x.percorso + ": " + x.messaggio).join(" · "), "e");
    else if (e.stato === 409) { msg(e.message + " — ricarico i dati correnti.", "e"); await apri(P.pratica_id); }
    else msg(e.message, "e");
  }
}
function tabellaCollezione(coll) {
  const campi = SCHEMA.collezioni[coll];
  const righe = P.dati[coll] || [];
  const t = document.createElement("div"); t.className = "tbl";
  const h = "<table><thead><tr>" + Object.keys(campi).map(c => "<th>" + c + "</th>").join("") + "<th></th></tr></thead><tbody></tbody></table>";
  t.innerHTML = h; const tb = t.querySelector("tbody");
  const riga = (e) => {
    const tr = document.createElement("tr"); const inputs = {};
    for (const [c, kind] of Object.entries(campi)) {
      const td = document.createElement("td"); let el;
      if (kind.startsWith("enum:")) {
        el = document.createElement("select"); el.append(new Option("", ""));
        for (const o of kind.slice(5).split("|")) el.append(new Option(o, o));
        el.value = e ? (e[c] || "") : "";
      } else { el = document.createElement("input"); el.value = e ? mostra(kind, e[c]) : ""; if (kind === "quota") el.placeholder = "1/2"; if (kind.startsWith("ref:")) el.placeholder = "id " + kind.slice(4); }
      el.setAttribute("aria-label", c); inputs[c] = [el, kind]; td.append(el); tr.append(td);
    }
    const td = document.createElement("td"); td.style.whiteSpace = "nowrap";
    const ok = document.createElement("button"); ok.className = "p"; ok.textContent = e ? "Salva" : "Aggiungi";
    ok.onclick = () => {
      const campiOp = {};
      for (const [c, [el, kind]] of Object.entries(inputs)) {
        const nuovo = leggiCampo(kind, el.value); const vecchio = e ? e[c] : undefined;
        if (JSON.stringify(nuovo) !== JSON.stringify(vecchio === undefined ? null : vecchio)) campiOp[c] = nuovo;
      }
      if (Object.keys(campiOp).length) salva([{op:"upsert", coll, ...(e ? {id: e.id} : {}), campi: campiOp}]);
    };
    td.append(ok);
    if (e) { const x = document.createElement("button"); x.textContent = "Elimina"; x.onclick = () => confirm("Eliminare la riga?") && salva([{op:"remove", coll, id:e.id}]); td.append(" ", x);
             const id = document.createElement("div"); id.className = "mut"; id.innerHTML = "<code>" + e.id + "</code>"; td.append(id); }
    tr.append(td); return tr;
  };
  for (const e of righe) tb.append(riga(e));
  tb.append(riga(null));
  return t;
}
async function pannello() {
  const el = $("#pannello"); el.innerHTML = "";
  if (SCHEMA.collezioni[TAB]) {
    const n = document.createElement("p"); n.className = "mut";
    n.innerHTML = "Quote: <code>1/2</code> · importi con il punto: <code>1234.50</code> · dato non noto: <code>?</code> oppure <code>[assente]</code>, <code>[zero]</code>, <code>[non_applicabile]</code>.";
    el.append(n, tabellaCollezione(TAB));
  } else if (TAB === "controlli") {
    const v = await api("/api/pratiche/" + P.pratica_id + "/verifica");
    el.innerHTML = "<p class='mut'>" + v.ambito + " · regole " + v.versione_regole + "</p><p class='" + (v.esito === "ok" ? "okc" : "err") + "'><b>" + (v.esito === "ok" ? "Nessun rilievo" : v.rilievi.length + " rilievi") + "</b></p>";
    const ul = document.createElement("ul");
    for (const r of v.rilievi) { const li = document.createElement("li"); li.innerHTML = "<code></code> "; li.querySelector("code").textContent = r.codice + " · " + r.percorso; li.append(r.messaggio); ul.append(li); }
    el.append(ul);
  } else if (TAB === "revisioni") {
    const r = await api("/api/pratiche/" + P.pratica_id + "/revisioni");
    const t = document.createElement("table"); t.innerHTML = "<thead><tr><th>n.</th><th>quando</th><th>chi</th><th>canale</th><th>variazioni</th><th></th></tr></thead>";
    for (const x of r.slice().reverse()) {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td></td><td></td><td></td><td></td><td></td><td></td>";
      const c = tr.children; c[0].textContent = x.n; c[1].textContent = x.ts; c[2].textContent = x.autore; c[3].textContent = x.canale; c[4].textContent = x.sommario;
      if (x.n !== P.revisione) { const b = document.createElement("button"); b.textContent = "Ripristina"; b.onclick = async () => {
        if (!confirm("Creare una nuova revisione con i dati della n. " + x.n + "? La cronologia resta intatta.")) return;
        try { await post("/api/pratiche/" + P.pratica_id + "/ripristina", {revisione_attesa: P.revisione, a_revisione: x.n}); await apri(P.pratica_id); } catch (e) { msg(e.message, "e"); } }; c[5].append(b); }
      t.append(tr);
    }
    el.append(t);
  } else if (TAB === "allegati") {
    const info = await api("/api/info");
    const a = await api("/api/pratiche/" + P.pratica_id + "/allegati");
    el.innerHTML = "<p class='mut'>Ghostscript: " + (info.pdfa.ghostscript ? "presente" : "assente") + " · veraPDF: " + (info.pdfa.veraPDF ? "presente" : "non configurato — la conformità PDF/A non può essere attestata") + "</p>";
    const f = document.createElement("div"); f.className = "bar";
    f.innerHTML = "<input type='file' id='file' aria-label='File'><input id='teg' placeholder='Tipo documento EG' aria-label='Tipo EG'><input id='fin' placeholder='Finalità / beneficiario' aria-label='Finalità'><button class='p' id='up'>Carica</button>";
    el.append(f);
    f.querySelector("#up").onclick = async () => {
      const file = f.querySelector("#file").files[0]; if (!file) return msg("Scegli un file", "e");
      const fd = new FormData(); fd.append("file", file); fd.append("tipo_eg", f.querySelector("#teg").value); fd.append("finalita", f.querySelector("#fin").value);
      try { await api("/api/pratiche/" + P.pratica_id + "/allegati", {method:"POST", body: fd}); await pannello(); } catch (e) { msg(e.message, "e"); } };
    const t = document.createElement("table"); t.innerHTML = "<thead><tr><th>nome</th><th>ruolo</th><th>byte</th><th>esito analisi</th><th>PDF/A</th><th></th></tr></thead>";
    for (const x of a) {
      const tr = document.createElement("tr"); tr.innerHTML = "<td></td><td></td><td></td><td></td><td></td><td></td>"; const c = tr.children;
      c[0].textContent = x.nome; c[1].textContent = x.ruolo; c[2].textContent = x.bytes;
      c[3].textContent = (x.analisi && x.analisi.esito || "") + ((x.analisi && x.analisi.avvisi || []).length ? " ⚠ " + x.analisi.avvisi.join("; ") : "");
      c[4].textContent = x.rapporto ? x.rapporto.validazione.esito + ((x.rapporto.avvisi || []).length ? " ⚠ " + x.rapporto.avvisi.join("; ") : "") : (x.analisi && x.analisi.dichiara_pdfa ? "dichiara " + x.analisi.dichiara_pdfa : "");
      if (x.ruolo === "originale" && x.analisi && ["leggibile","firmato"].includes(x.analisi.esito)) { const b = document.createElement("button"); b.textContent = "Converti in PDF/A"; b.onclick = async () => { try { await api("/api/allegati/" + x.id + "/pdfa", {method:"POST"}); await pannello(); } catch (e) { msg(e.message, "e"); } }; c[5].append(b); }
      t.append(tr);
    }
    el.append(t);
  }
}
$("#crea").onclick = async () => { const t = $("#nuovoTitolo").value.trim(); if (!t) return; const r = await post("/api/pratiche", {titolo: t, chiave: crypto.randomUUID()}); $("#nuovoTitolo").value = ""; await caricaLista(); await apri(r.pratica_id); };
(async () => {
  try { const i = await api("/api/info"); $("#info").textContent = "v" + i.versione + " · accesso solo da questo computer"; SCHEMA = await api("/api/schema"); await caricaLista(); }
  catch (e) { msg("Impossibile avviare: " + e.message, "e"); }
})();
</script>
</body>
</html>
